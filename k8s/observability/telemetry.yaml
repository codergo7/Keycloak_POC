apiVersion: telemetry.istio.io/v1
kind: Telemetry
metadata:
  name: spring-debug-access-logs
  namespace: spring-api
spec:
  selector:
    matchLabels:
      app: spring-app
  accessLogging:
    - providers:
        - name: envoy
      filter:
        expression: 'request.url_path.startsWith("/api/")'


---

apiVersion: telemetry.istio.io/v1
kind: Telemetry
metadata:
  name: ingress-debug-access-logs
  namespace: istio-system
spec:
  selector:
    matchLabels:
      app: istio-ingressgateway
  accessLogging:
    - providers:
        - name: envoy
      filter:
        expression: 'request.url_path.startsWith("/api/")'