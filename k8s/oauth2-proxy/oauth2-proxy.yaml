apiVersion: v1
kind: Secret
metadata:
  name: oauth2-proxy-secret
  namespace: identity
type: Opaque
stringData:
  client-secret: oauth2-proxy-secret
  cookie-secret: "0123456789abcdef0123456789abcdef"
---
apiVersion: v1
kind: Service
metadata:
  name: oauth2-proxy
  namespace: identity
spec:
  selector:
    app: oauth2-proxy
  ports:
    - name: http
      port: 4180
      targetPort: 4180

---
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: oauth2-proxy
  namespace: identity
spec:
  hosts:
    - app.localhost
  gateways:
    - istio-system/poc-gateway
    # OAuth2-Proxy login and callback endpoints
  http:
    # Route OAuth2 authentication endpoints to oauth2-proxy
    - match:
        - uri:
            prefix: /oauth2/
      route:
        - destination:
            host: oauth2-proxy.identity.svc.cluster.local
            port:
              number: 4180
      # --set-xauthrequest makes oauth2-proxy return identity/token headers;
      # they are only meant for ext_authz, never for the browser
      headers:
        response:
          remove:
            - x-auth-request-user
            - x-auth-request-email
            - x-auth-request-groups
            - x-auth-request-preferred-username
            - x-auth-request-access-token
            - authorization

    # Reports API (FastAPI) for the browser; same cookie rule as Spring
    - match:
        - uri:
            exact: /reports
      route:
        - destination:
            host: reports-api.reports-api.svc.cluster.local
            port:
              number: 8080
      headers:
        request:
          remove:
            - cookie

    # Route all other requests to Spring Boot
    - route:
        - destination:
            host: spring-app.spring-api.svc.cluster.local
            port:
              number: 8080
      # The oauth2-proxy session cookie is only for ext_authz, which runs
      # before route header rules; Spring is stateless and must not see it
      headers:
        request:
          remove:
            - cookie
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oauth2-proxy
  namespace: identity
spec:
  replicas: 1
  selector:
    matchLabels:
      app: oauth2-proxy
  template:
    metadata:
      labels:
        app: oauth2-proxy
    spec:
      serviceAccountName: oauth2-proxy
      containers:
        - name: oauth2-proxy
          image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.3
          args:
            - --http-address=0.0.0.0:4180
            - --provider=keycloak-oidc
            - --client-id=oauth2-proxy
            - --client-secret=$(CLIENT_SECRET)
            - --cookie-secret=$(COOKIE_SECRET)
            - --cookie-secure=false
            - --cookie-samesite=lax
            - --cookie-refresh=4m
            - --cookie-expire=8h
            - --email-domain=*
            - --oidc-issuer-url=http://keycloak.localhost:8080/realms/demo
            - --skip-oidc-discovery=true
            - --login-url=http://keycloak.localhost:8080/realms/demo/protocol/openid-connect/auth
            - --redeem-url=http://keycloak.identity.svc.cluster.local:8080/realms/demo/protocol/openid-connect/token
            - --oidc-jwks-url=http://keycloak.identity.svc.cluster.local:8080/realms/demo/protocol/openid-connect/certs
            - --profile-url=http://keycloak.identity.svc.cluster.local:8080/realms/demo/protocol/openid-connect/userinfo
            - --redirect-url=http://app.localhost:8080/oauth2/callback
            # reports adds reports-api to the access token audience, so the
            # browser session can also call the reports API through app.localhost
            - --scope=openid profile email groups app-audience reports
            #- --upstream=http://spring-app.spring-api.svc.cluster.local:8080
            - --upstream=static://200
            - --pass-access-token=true
            - --pass-authorization-header=true
            - --pass-host-header=true
            - --skip-provider-button=true
            - --set-xauthrequest=true
          env:
            - name: CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: oauth2-proxy-secret
                  key: client-secret
            - name: COOKIE_SECRET
              valueFrom:
                secretKeyRef:
                  name: oauth2-proxy-secret
                  key: cookie-secret
          ports:
            - containerPort: 4180
              name: http
          readinessProbe:
            httpGet:
              path: /ping
              port: 4180
            initialDelaySeconds: 3
            periodSeconds: 5
