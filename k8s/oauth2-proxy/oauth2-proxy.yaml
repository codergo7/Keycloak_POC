apiVersion: v1
kind: Secret
metadata:
  name: oauth2-proxy-secret
  namespace: iam
type: Opaque
stringData:
  client-secret: oauth2-proxy-secret
  cookie-secret: "0123456789abcdef0123456789abcdef"
---
apiVersion: v1
kind: Service
metadata:
  name: oauth2-proxy
  namespace: iam
spec:
  selector:
    app: oauth2-proxy
  ports:
    - name: http
      port: 4180
      targetPort: 4180

---
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: oauth2-proxy
  namespace: iam
spec:
  hosts:
    - app.localhost
  gateways:
    - istio-system/poc-gateway
  http:
    - route:
        - destination:
            host: oauth2-proxy.iam.svc.cluster.local
            port:
              number: 4180      
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oauth2-proxy
  namespace: iam
spec:
  replicas: 1
  selector:
    matchLabels:
      app: oauth2-proxy
  template:
    metadata:
      labels:
        app: oauth2-proxy
    spec:
      serviceAccountName: oauth2-proxy
      containers:
        - name: oauth2-proxy
          image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.3
          args:
            - --http-address=0.0.0.0:4180
            - --provider=keycloak-oidc
            - --client-id=oauth2-proxy
            - --client-secret=$(CLIENT_SECRET)
            - --cookie-secret=$(COOKIE_SECRET)
            - --cookie-secure=false
            - --cookie-samesite=lax
            - --email-domain=*
            - --oidc-issuer-url=http://keycloak.localhost:8080/realms/poc
            - --skip-oidc-discovery=true
            - --login-url=http://keycloak.localhost:8080/realms/poc/protocol/openid-connect/auth
            - --redeem-url=http://keycloak.iam.svc.cluster.local:8080/realms/poc/protocol/openid-connect/token
            - --oidc-jwks-url=http://keycloak.iam.svc.cluster.local:8080/realms/poc/protocol/openid-connect/certs
            - --profile-url=http://keycloak.iam.svc.cluster.local:8080/realms/poc/protocol/openid-connect/userinfo
            - --redirect-url=http://app.localhost:8080/oauth2/callback
            - --scope=openid profile email groups app-audience
            - --upstream=http://spring-app.demo.svc.cluster.local:8080
            - --pass-access-token=true
            - --pass-authorization-header=true
            - --pass-host-header=false
            - --set-xauthrequest=true
            - --skip-provider-button=true
            - --set-xauthrequest=false
          env:
            - name: CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: oauth2-proxy-secret
                  key: client-secret
            - name: COOKIE_SECRET
              valueFrom:
                secretKeyRef:
                  name: oauth2-proxy-secret
                  key: cookie-secret
          ports:
            - containerPort: 4180
              name: http
          readinessProbe:
            httpGet:
              path: /ping
              port: 4180
            initialDelaySeconds: 3
            periodSeconds: 5
