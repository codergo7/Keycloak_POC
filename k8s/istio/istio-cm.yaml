
apiVersion: v1
kind: ConfigMap
metadata:
  name: istio
  namespace: istio-system
  labels:
    app.kubernetes.io/instance: istio
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: istiod
    app.kubernetes.io/part-of: istio
    app.kubernetes.io/version: 1.31.0
    helm.sh/chart: istiod-1.31.0
    install.operator.istio.io/owning-resource: unknown
    install.operator.istio.io/owning-resource-namespace: istio-system
    istio.io/rev: default
    operator.istio.io/component: Pilot
    operator.istio.io/managed: Reconcile
    operator.istio.io/version: 1.31.0
    release: istio
data:
  mesh: |-
    accessLogFile: /dev/stdout
    accessLogEncoding: TEXT
    accessLogFormat: |
    accessLogFormat: |
      [%START_TIME%] method=%REQ(:METHOD)% path=%REQ(:PATH)% status=%RESPONSE_CODE% details=%RESPONSE_CODE_DETAILS% user=%REQ(X-AUTH-REQUEST-USER)% jwt_subject=%DYNAMIC_METADATA(envoy.filters.http.jwt_authn:payload:sub)%
    defaultConfig:
      discoveryAddress: istiod.istio-system.svc:15012

    defaultProviders:
      metrics:
        - prometheus

    enablePrometheusMerge: true

    extensionProviders:
      # Existing telemetry providers
      - name: otel
        envoyOtelAls:
          port: 4317
          service: opentelemetry-collector.observability.svc.cluster.local

      - name: skywalking
        skywalking:
          port: 11800
          service: tracing.istio-system.svc.cluster.local

      - name: otel-tracing
        opentelemetry:
          port: 4317
          service: opentelemetry-collector.observability.svc.cluster.local

      - name: jaeger
        opentelemetry:
          port: 4317
          service: jaeger-collector.istio-system.svc.cluster.local

      # NEW: oauth2-proxy external authorization
      - name: oauth2-proxy
        envoyExtAuthzHttp:
          service: oauth2-proxy.identity.svc.cluster.local
          port: 4180

          includeRequestHeadersInCheck:
            - authorization
            - cookie

          headersToUpstreamOnAllow:
            - authorization
            - x-auth-request-user
            - x-auth-request-email
            - x-auth-request-access-token

          headersToDownstreamOnAllow:
            - set-cookie

          headersToDownstreamOnDeny:
            - content-type
            - set-cookie
            - location

    rootNamespace: istio-system
    trustDomain: cluster.local

  meshNetworks: 'networks: {}'
