apiVersion: security.istio.io/v1
kind: RequestAuthentication
metadata:
  name: demo-jwt-validation
  namespace: istio-system
spec:
  selector:
    matchLabels:
      app: istio-ingressgateway
  jwtRules:
    - issuer: "http://keycloak.localhost:8080/realms/demo"
      jwksUri: "http://keycloak.identity.svc.cluster.local:8080/realms/demo/protocol/openid-connect/certs"
      forwardOriginalToken: true
    - issuer: "http://keycloak.localhost:8080/realms/master"
      jwksUri: "http://keycloak.identity.svc.cluster.local:8080/realms/master/protocol/openid-connect/certs"
      forwardOriginalToken: true

---

apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: oauth2-external-auth
  namespace: istio-system
spec:
  selector:
    matchLabels:
      istio: ingressgateway
  action: CUSTOM
  provider:
    name: oauth2-proxy
  rules:
    - to:
        - operation:
            hosts:
              - app.localhost
              - "app.localhost:*"
            notPaths:
              - /oauth2/*
              - /api/public
              - /actuator/health
      # No exceptions for Bearer tokens or non-browser user agents: app.localhost is
      # browser-only, so OAuth2-Proxy always sets the identity headers. With exceptions,
      # a caller with any valid token could send its own X-Auth-Request-User to Spring.
      # Scripts use api.localhost.

---


apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: ingress-authorization
  namespace: istio-system
spec:
  selector:
    matchLabels:
      istio: ingressgateway
  action: ALLOW
  rules:
    # Keycloak login and OIDC endpoints
    - to:
        - operation:
            hosts:
              - keycloak.localhost
              - "keycloak.localhost:*"

    # Browser traffic: authentication is handled
    # by the separate CUSTOM AuthorizationPolicy
    - to:
        - operation:
            hosts:
              - app.localhost
              - "app.localhost:*"

    # Public API endpoint
    - to:
        - operation:
            hosts:
              - api.localhost
              - "api.localhost:*"
            methods: ["GET"]
            paths: ["/api/public"]

    # JWT-authenticated API requests
    - from:
        - source:
            requestPrincipals: ["*"]
      to:
        - operation:
            hosts:
              - api.localhost
              - "api.localhost:*"
            methods: ["GET"]
            paths:
              - /api/user
              - /api/whoami
              - /api/headers
              - /api/admin

    # JWT-authenticated reports API requests
    - from:
        - source:
            requestPrincipals: ["*"]
      to:
        - operation:
            hosts:
              - api.localhost
              - "api.localhost:*"
            methods: ["GET", "POST"]
            paths: ["/reports"]
