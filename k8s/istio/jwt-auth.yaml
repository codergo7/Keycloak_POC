apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: ingress-authorization
  namespace: istio-system
spec:
  selector:
    matchLabels:
      istio: ingressgateway

  action: ALLOW

  rules:
    # 1. Keycloak
    # Login, OIDC endpoints, Admin Console and Admin REST API.
    # Keycloak enforces its own authentication and authorization.
    - to:
        - operation:
            hosts:
              - "keycloak.localhost"
              - "keycloak.localhost:*"

    # 2. Browser application
    # OAuth2-Proxy handles sessions and OIDC redirects.
    - to:
        - operation:
            hosts:
              - "app.localhost"
              - "app.localhost:*"

    # 3. Direct Spring REST API
    # Spring's Envoy validates JWTs and checks roles.
    - to:
        - operation:
            hosts:
              - "api.localhost"
              - "api.localhost:*"
            paths:
              - "/api/public"
              - "/api/user"
              - "/api/whoami"
              - "/api/headers"
              - "/api/admin"
