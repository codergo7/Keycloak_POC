apiVersion: security.istio.io/v1
kind: RequestAuthentication
metadata:
  name: keycloak-jwt
  namespace: istio-system
spec:
  selector:
    matchLabels:
      istio: ingressgateway
  jwtRules:
    - issuer: "http://keycloak.localhost:8080/realms/poc"
      jwksUri: "http://keycloak.iam.svc.cluster.local:8080/realms/poc/protocol/openid-connect/certs"
      forwardOriginalToken: true
    - issuer: "http://keycloak.localhost:8080/realms/master"
      jwksUri: "http://keycloak.iam.svc.cluster.local:8080/realms/master/protocol/openid-connect/certs"
      forwardOriginalToken: true      
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: ingress-authorization
  namespace: istio-system
spec:
  selector:
    matchLabels:
      istio: ingressgateway

  action: ALLOW

  rules:
    # Keycloak
    - to:
        - operation:
            hosts:
              - "keycloak.localhost"
              - "keycloak.localhost:*"

    # oauth2-proxy
    - to:
        - operation:
            hosts:
              - "app.localhost"
              - "app.localhost:*"

    # Public API
    - to:
        - operation:
            paths:
              - "/api/public"
              - "/actuator/health"

    # Any authenticated POC user
    - from:
        - source:
            requestPrincipals:
              - "*"
      to:
        - operation:
            paths:
              - "/api/user"
              - "/api/whoami"
              - "/api/headers"

    # Admin only
    - from:
        - source:
            requestPrincipals:
              - "*"
      to:
        - operation:
            paths:
              - "/api/admin"
      when:
        - key: request.auth.claims[realm_access][roles]
          values:
            - "admin"
