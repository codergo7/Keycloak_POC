apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: poc-gateway
  namespace: istio-system
spec:
  selector:
    istio: ingressgateway
  servers:
    - port:
        number: 80
        name: http
        protocol: HTTP
      hosts:
        - keycloak.localhost
        - app.localhost
        - api.localhost
#        - keycloak.iam.svc.cluster.local



