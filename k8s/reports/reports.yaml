apiVersion: v1
kind: Service
metadata:
  name: reports-api
  namespace: reports-api
spec:
  selector:
    app: reports-api
  ports:
    - name: http
      port: 8080
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: reports-api
  namespace: reports-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: reports-api
  template:
    metadata:
      labels:
        app: reports-api
    spec:
      containers:
        - name: app
          image: iam-poc-reports:dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 2
            periodSeconds: 3
