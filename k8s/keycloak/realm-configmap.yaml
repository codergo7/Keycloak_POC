apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-realm
  namespace: iam
data:
  realm.json: |
    {
      "realm": "poc",
      "enabled": true,
      "displayName": "IAM POC",
      "registrationAllowed": true,
      "resetPasswordAllowed": true,
      "rememberMe": true,
      "verifyEmail": false,
      "roles": {
        "realm": [
          {
            "name": "user"
          },
          {
            "name": "developer"
          },
          {
            "name": "premium"
          },
          {
            "name": "admin"
          },
          {
            "name": "power-user",
            "composite": true,
            "composites": {
              "realm": [
                "developer",
                "premium"
              ]
            }
          }
        ]
      },
      "groups": [
        {
          "name": "engineering",
          "realmRoles": [
            "developer"
          ],
          "subGroups": [
            {
              "name": "platform",
              "realmRoles": [
                "premium"
              ]
            }
          ]
        },
        {
          "name": "admins",
          "realmRoles": [
            "admin"
          ]
        }
      ],
      "clientScopes": [
        {
          "name": "groups",
          "description": "Add Keycloak groups to tokens",
          "protocol": "openid-connect",
          "attributes": {
            "include.in.token.scope": "true",
            "display.on.consent.screen": "true"
          },
          "protocolMappers": [
            {
              "name": "groups",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-group-membership-mapper",
              "consentRequired": false,
              "config": {
                "full.path": "true",
                "id.token.claim": "true",
                "access.token.claim": "true",
                "userinfo.token.claim": "true",
                "claim.name": "groups"
              }
            }
          ]
        },
        {
          "name": "app-audience",
          "description": "Add spring-api to aud claim",
          "protocol": "openid-connect",
          "attributes": {
            "include.in.token.scope": "true"
          },
          "protocolMappers": [
            {
              "name": "spring-api-audience",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-audience-mapper",
              "consentRequired": false,
              "config": {
                "included.client.audience": "spring-api",
                "id.token.claim": "false",
                "access.token.claim": "true",
                "introspection.token.claim": "true"
              }
            }
          ]
        }
      ],
      "clients": [
        {
          "clientId": "spring-api",
          "name": "Spring API",
          "enabled": true,
          "protocol": "openid-connect",
          "bearerOnly": true,
          "publicClient": false,
          "standardFlowEnabled": false,
          "directAccessGrantsEnabled": false,
          "serviceAccountsEnabled": false,
          "authorizationServicesEnabled": false
        },
        {
          "clientId": "cli-client",
          "name": "CLI test client",
          "enabled": true,
          "protocol": "openid-connect",
          "publicClient": false,
          "secret": "cli-secret",
          "standardFlowEnabled": false,
          "directAccessGrantsEnabled": true,
          "serviceAccountsEnabled": true,
          "defaultClientScopes": [
            "profile",
            "email",
            "roles",
            "web-origins",
            "groups",
            "app-audience"
          ]
        },
        {
          "clientId": "oauth2-proxy",
          "name": "oauth2-proxy",
          "enabled": true,
          "protocol": "openid-connect",
          "publicClient": false,
          "secret": "oauth2-proxy-secret",
          "standardFlowEnabled": true,
          "directAccessGrantsEnabled": false,
          "redirectUris": [
            "http://app.localhost:8080/oauth2/callback"
          ],
          "webOrigins": [
            "http://app.localhost:8080"
          ],
          "defaultClientScopes": [
            "profile",
            "email",
            "roles",
            "web-origins",
            "groups",
            "app-audience"
          ]
        }
      ],
      "users": [
        {
          "username": "alice",
          "enabled": true,
          "email": "alice@example.test",
          "firstName": "Alice",
          "lastName": "Engineer",
          "emailVerified": true,
          "credentials": [
            {
              "type": "password",
              "value": "alice",
              "temporary": false
            }
          ],
          "realmRoles": [
            "user"
          ],
          "groups": [
            "/engineering",
            "/engineering/platform"
          ]
        },
        {
          "username": "bob",
          "enabled": true,
          "email": "bob@example.test",
          "firstName": "Bob",
          "lastName": "User",
          "emailVerified": true,
          "credentials": [
            {
              "type": "password",
              "value": "bob",
              "temporary": false
            }
          ],
          "realmRoles": [
            "user",
            "premium"
          ]
        },
        {
          "username": "admin",
          "enabled": true,
          "email": "admin@example.test",
          "firstName": "Admin",
          "lastName": "User",
          "emailVerified": true,
          "credentials": [
            {
              "type": "password",
              "value": "admin",
              "temporary": false
            }
          ],
          "realmRoles": [
            "user",
            "admin"
          ],
          "groups": [
            "/admins"
          ]
        }
      ]
    }
