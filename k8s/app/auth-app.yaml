
apiVersion: security.istio.io/v1
kind: RequestAuthentication
metadata:
  name: keycloak-jwt
  namespace: demo
spec:
  selector:
    matchLabels:
      app: spring-app
  jwtRules:
    - issuer: http://keycloak.localhost:8080/realms/poc
      jwksUri: http://keycloak.iam.svc.cluster.local:8080/realms/poc/protocol/openid-connect/certs
      audiences:
        - spring-api
      forwardOriginalToken: true
      fromHeaders:
        - name: Authorization
          prefix: "Bearer "
        - name: X-Auth-Request-Access-Token

      # audiences:
      # - "spring-app"
      # outputPayloadToHeader: "x-jwt-payload"
      # outputClaimToHeaders:
      # - header: "x-user-id"
      #   claim: "sub"
      # - header: "x-user-email"
      #   claim: "email"
      # - header: "x-user-role"
      #   claim: "role"         

---

apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: spring-workload-authorization
  namespace: demo
spec:
  selector:
    matchLabels:
      app: spring-app
  action: ALLOW
  rules:
    # Public endpoint
    - to:
        - operation:
            methods: ["GET"]
            paths: ["/api/public"]

    # User role
    - from:
        - source:
            requestPrincipals: ["*"]
      to:
        - operation:
            methods: ["GET"]
            paths:
              - /api/user
              - /api/whoami
      when:
        - key: request.auth.claims[realm_access][roles]
          values: ["user"]

    # Developer role
    - from:
        - source:
            requestPrincipals: ["*"]
      to:
        - operation:
            methods: ["GET"]
            paths: ["/api/headers"]
      when:
        - key: request.auth.claims[realm_access][roles]
          values: ["developer"]

    # Admin role
    - from:
        - source:
            requestPrincipals: ["*"]
      to:
        - operation:
            methods: ["GET"]
            paths: ["/api/admin"]
      when:
        - key: request.auth.claims[realm_access][roles]
          values: ["admin"]

    # Internal service-to-service endpoint
    - from:
        - source:
            principals:
              - cluster.local/ns/service-a/sa/service-a
      to:
        - operation:
            methods: ["GET"]
            paths: ["/api/internal"]

---

apiVersion: security.istio.io/v1
kind: PeerAuthentication
metadata:
  name: demo-strict-mtls
  namespace: demo
spec:
  mtls:
    mode: STRICT