
apiVersion: security.istio.io/v1
kind: RequestAuthentication
metadata:
  name: keycloak-jwt
  namespace: spring-api
spec:
  selector:
    matchLabels:
      app: spring-app
  jwtRules:
    - issuer: http://keycloak.localhost:8080/realms/demo
      jwksUri: http://keycloak.identity.svc.cluster.local:8080/realms/demo/protocol/openid-connect/certs
      audiences:
        - spring-api
      forwardOriginalToken: true
      fromHeaders:
        - name: Authorization
          prefix: "Bearer "
        - name: X-Auth-Request-Access-Token

      # Identity headers come from the verified token, overwriting anything the
      # client sent, so the app can trust them on every path.
      outputClaimToHeaders:
        - header: x-auth-request-user
          claim: sub
        - header: x-auth-request-email
          claim: email

---

apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: spring-workload-authorization
  namespace: spring-api
spec:
  selector:
    matchLabels:
      app: spring-app
  action: ALLOW
  rules:
    # Public endpoint
    - to:
        - operation:
            methods: ["GET"]
            paths: ["/api/public"]

    # User role
    - from:
        - source:
            requestPrincipals: ["*"]
      to:
        - operation:
            methods: ["GET"]
            paths:
              - /api/user
              - /api/whoami
      when:
        - key: request.auth.claims[realm_access][roles]
          values: ["user"]

    # Developer role
    - from:
        - source:
            requestPrincipals: ["*"]
      to:
        - operation:
            methods: ["GET"]
            paths: ["/api/headers"]
      when:
        - key: request.auth.claims[realm_access][roles]
          values: ["developer"]

    # Admin role
    - from:
        - source:
            requestPrincipals: ["*"]
      to:
        - operation:
            methods: ["GET"]
            paths: ["/api/admin"]
      when:
        - key: request.auth.claims[realm_access][roles]
          values: ["admin"]




























































