apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: api
  namespace: spring-api
spec:
  hosts:
    - api.localhost
  gateways:
    - istio-system/poc-gateway
  http:
    # Reports API (FastAPI)
    - match:
        - uri:
            exact: /reports
      route:
        - destination:
            host: reports-api.reports-api.svc.cluster.local
            port:
              number: 8080

    # Route all other requests to Spring Boot
    - route:
        - destination:
            host: spring-app.spring-api.svc.cluster.local
            port:
              number: 8080
# the following config didn't work
# headers are removed in the envoy filter
      # headers:
      #   response:
      #     remove:
      #       - x-auth-request-access-token
      #       - authorization

---
apiVersion: v1
kind: Service
metadata:
  name: spring-app
  namespace: spring-api
spec:
  selector:
    app: spring-app
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spring-app
  namespace: spring-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: spring-app
  template:
    metadata:
      labels:
        app: spring-app
    spec:
      containers:
        - name: app
          image: iam-poc-app:dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 4
            periodSeconds: 3
          