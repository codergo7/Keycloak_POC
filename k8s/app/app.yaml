apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: api
  namespace: demo
spec:
  hosts:
    - api.localhost
  gateways:
    - istio-system/poc-gateway
  http:
    - route:
        - destination:
            host: spring-app.demo.svc.cluster.local
            port:
              number: 8080

---
apiVersion: v1
kind: Service
metadata:
  name: spring-app
  namespace: demo
spec:
  selector:
    app: spring-app
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spring-app
  namespace: demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: spring-app
  template:
    metadata:
      labels:
        app: spring-app
    spec:
      containers:
        - name: app
          image: iam-poc-app:dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 4
            periodSeconds: 3
          